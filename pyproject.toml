[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-hexagonal-api"
version = "0.1.0"
description = "Secure Flask REST API boilerplate using hexagonal architecture"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-Limiter>=3.8,<5",
  "gunicorn>=23,<24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "pip-audit>=2.7,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --disable-warnings --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
